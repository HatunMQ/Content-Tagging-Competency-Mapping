apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-a-qwen
  namespace: contentmap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-a-qwen
  template:
    metadata:
      labels:
        app: model-a-qwen
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          args:
            - "--model=Qwen/Qwen2.5-VL-7B-Instruct"
            - "--served-model-name=Qwen2.5-VL-7B-Instruct"
            - "--host=0.0.0.0"
            - "--port=8000"
            - "--trust-remote-code"
          ports:
            - containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface
      volumes:
        - name: hf-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: model-a-qwen-svc
  namespace: contentmap
spec:
  selector:
    app: model-a-qwen
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP