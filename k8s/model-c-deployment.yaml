apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-c-llama
  namespace: contentmap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-c-llama
  template:
    metadata:
      labels:
        app: model-c-llama
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.10.2
          args:
            - "--model=meta-llama/Llama-3.2-11B-Vision-Instruct"
            - "--served-model-name=Llama-3.2-11B-Vision-Instruct"
            - "--host=0.0.0.0"
            - "--port=8000"
            - "--trust-remote-code"
            - "--max-model-len=8192"
            - "--max-num-seqs=2"
          ports:
            - containerPort: 8000
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface
      volumes:
        - name: hf-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: model-c-llama-svc
  namespace: contentmap
spec:
  selector:
    app: model-c-llama
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
