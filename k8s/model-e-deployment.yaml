apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-e-qwen35-9b
  namespace: contentmap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-e-qwen35-9b
  template:
    metadata:
      labels:
        app: model-e-qwen35-9b
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:nightly
          args:
            - "--model=Qwen/Qwen3.5-9B"
            - "--served-model-name=Qwen3.5-9B"
            - "--host=0.0.0.0"
            - "--port=8000"
            - "--trust-remote-code"
            - "--max-model-len=32768"
            - "--max-num-seqs=16"
            - "--gpu-memory-utilization=0.65"
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface
          ports:
            - containerPort: 8000
      volumes:
        - name: hf-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: model-e-qwen35-9b-svc
  namespace: contentmap
spec:
  selector:
    app: model-e-qwen35-9b
  ports:
    - port: 8000
      targetPort: 8000
